# LDT4SSC pilot metadata
#
# This file describes your pilot at a glance and is read by the LDT4SSC
# aggregator to know what your pilot is and how to present it on the
# Knowledge Hub and the project website.
#
# This is the FIRST FILE you should edit after creating your pilot
# repository from the template. A pilot repository without a properly
# filled-in pilot.yaml will not be picked up by the aggregator.
#
# Replace all placeholder values (in <angle brackets>) with your pilot's
# real information. Remove any optional fields you do not use.

schema_version: 1

# Short name of the pilot, in lowercase with hyphens (used in URLs)
short_name: perform

# Human-readable name of the pilot
name: PERFORM

# Short description of the pilot (one or two sentences)
description: >
  A federated network of AI-reasoning Local Digital Twins transforming public buildings into a coordinated energy flexibility and renewable energy integration system for municipalities.

# LDT4SSC work strand: WS1, WS2, or WS3
work_strand: WS2

# The cities, regions, or communities involved in this pilot
locations:
  - city: Municipality of Naoussa
    country: Greece
    country_code: EL
  # Add more entries as needed for multi-city pilots

  - city: Municipality of Vila Franca de Xira
    country: Portugal
    country_code: PT
    # Add more entries as needed for multi-city pilots

# The thematic focus areas of the pilot, drawn from the LDT4SSC topic list.
# Pick all that apply. The full list is documented in the LDT4SSC Knowledge
# Hub under Resources for Pilots.
focus_areas:
  - Building energy monitoring & optimisation
  - Renewable energy & storage investment planning

# The consortium members participating in this pilot
consortium:
  - name: Clockwork
    role: Pilot lead, Technology partner
    country_code: EL
    website: https://clockwork-energy.gr/  # optional
  # Add more entries for each consortium member

  - name: Ubitech
    role: Technology partner
    country_code: EL
    website: https://ubitech.eu/  # optional
  # Add more entries for each consortium member

  - name: Municipality of Heroic City of Naoussa
    role: Public authority
    country_code: EL
    website: https://www.naoussa.gr/ # optional
  # Add more entries for each consortium member

  - name: Stereograph
    role: Technology partner
    country_code: FR
    website: https://www.stereograph.fr/  # optional
  # Add more entries for each consortium member

  - name: Municipality of Vila Franca de Xira
    role: Public authority
    country_code: PT
    website: https://www.cm-vfxira.pt/  # optional
  # Add more entries for each consortium member

  - name: Technical University of Denmark
    role: Research
    country_code: DK
    website: https://dtu.dk/  # optional
  # Add more entries for each consortium member

  - name: Nhood Services Portugal
    role: Technology partner
    country_code: PT
    website: https://nhood.pt/  # optional
  # Add more entries for each consortium member

  - name: AI-nergy
    role: Technology partner
    country_code: DK
